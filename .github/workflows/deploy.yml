name: Deploy to Vercel
on:
  push:
    branches: [main]
    # Yalnız belge değişen gönderimler yayın tetiklemez (15 Kas 2026): her
    # yayın Vercel'in uç önbelleğini sıfırlıyor ve sayfalar/görseller yeniden
    # üretiliyor — ücretsiz plandaki sunucu süresi. Kodla birlikte değişen
    # belge yine yayınla gider (paths-ignore yalnız TÜM dosyalar eşleşirse atlar).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
